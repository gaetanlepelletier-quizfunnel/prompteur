<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prompteur">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Prompteur</title>
<style>
:root{
  --bg:#0b0b0c; --panel:#161618; --panel2:#232326; --line:#2c2c30;
  --text:#f2f2f3; --muted:#9a9aa2; --accent:#ffb020; --danger:#ff5a4f;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
body{position:fixed;inset:0;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}

.view{position:absolute;top:0;left:0;right:0;height:var(--app-h,100%);display:none;flex-direction:column}
.view.active{display:flex}

.bar{display:flex;align-items:center;gap:8px;min-height:56px;
  padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 12px) 8px calc(env(safe-area-inset-left) + 12px)}
.bar h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em;padding:6px 4px}
.bar-title{flex:1;font-weight:600;text-align:center}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.icon-btn:active{background:var(--panel2)}
.icon-btn.danger{color:var(--danger)}

/* Bibliothèque */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:4px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 110px) calc(env(safe-area-inset-left) + 16px)}
#list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.card{display:flex;align-items:center;background:var(--panel);border-radius:16px;overflow:hidden}
.card-main{flex:1;min-width:0;text-align:left;padding:16px;display:flex;flex-direction:column;gap:4px}
.card-main:active{background:var(--panel2)}
.card-title{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{color:var(--muted);font-size:14px}
.card-play{width:48px;height:48px;margin-right:12px;border-radius:50%;background:var(--accent);color:#111;display:grid;place-items:center}
.card-play svg{fill:currentColor;stroke:none;margin-left:3px}
.empty{color:var(--muted);text-align:center;margin-top:30vh}
.fab{position:absolute;right:calc(env(safe-area-inset-right) + 20px);bottom:calc(env(safe-area-inset-bottom) + 20px);
  height:56px;padding:0 24px;border-radius:28px;background:var(--accent);color:#111;font-weight:700;font-size:17px;
  display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.fab:active,.primary:active,.card-play:active,.play-btn:active{transform:scale(.96)}
.install{display:flex;align-items:center;gap:10px;margin:0 calc(env(safe-area-inset-right) + 16px) 10px calc(env(safe-area-inset-left) + 16px);
  padding:12px 12px 12px 16px;background:var(--panel2);border-radius:14px;font-size:14px}
.install span{flex:1}
.install .go{background:var(--accent);color:#111;font-weight:700;padding:8px 14px;border-radius:10px}
.install .x{width:32px;height:32px;color:var(--muted);font-size:22px}

/* Éditeur */
#text{flex:1;width:100%;resize:none;border:0;outline:0;background:transparent;color:var(--text);
  font-family:inherit;font-size:18px;line-height:1.55;padding:8px calc(env(safe-area-inset-right) + 18px) 24px calc(env(safe-area-inset-left) + 18px)}
#text::placeholder{color:#5c5c63}
.editor-foot{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);background:var(--bg);
  padding:12px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 16px)}
#stats{flex:1;color:var(--muted);font-size:14px}
.primary{height:52px;padding:0 22px;border-radius:26px;background:var(--accent);color:#111;font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.primary svg{fill:currentColor;stroke:none}

/* Prompteur */
#prompter{background:var(--pbg);color:var(--pfg)}
#prompter.t-dark{--pbg:#000;--pfg:#fff;--cue:#ffb020}
#prompter.t-light{--pbg:#fff;--pfg:#111;--cue:#d9480f}
#prompter.t-yellow{--pbg:#000;--pfg:#ffd83d;--cue:#6fd3ff}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
#flip{position:absolute;inset:0}
#ptext{position:absolute;top:0;left:0;right:0;margin:0;
  padding:0 calc(var(--margin) + env(safe-area-inset-right)) 0 calc(var(--margin) + env(safe-area-inset-left));
  font-size:var(--size);line-height:var(--lh);font-weight:600;white-space:pre-wrap;overflow-wrap:break-word;will-change:transform}
.cue{color:var(--cue);font-style:italic;font-weight:500}
#guide{position:absolute;left:0;right:0;top:var(--guide);height:calc(var(--size) * var(--lh));transform:translateY(-50%);
  background:rgba(255,176,32,.13)}
#guide::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  border-left:14px solid var(--accent);border-top:11px solid transparent;border-bottom:11px solid transparent}
.fade{position:absolute;left:0;right:0;pointer-events:none}
.fade-top{top:0;height:calc(var(--guide) - var(--size) * var(--lh) / 2);background:linear-gradient(var(--pbg),transparent);opacity:.85}
.fade-bot{bottom:0;height:calc(env(safe-area-inset-bottom) + 150px);background:linear-gradient(transparent,var(--pbg) 55%)}
#progress{position:absolute;top:env(safe-area-inset-top);left:0;right:0;height:3px;background:var(--accent);transform:scaleX(0);transform-origin:left;pointer-events:none}

.ctl{position:absolute;left:0;right:0;display:flex;align-items:center;transition:opacity .3s;z-index:5;pointer-events:none}
.ctl>*{pointer-events:auto}
.p-top{top:0;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 12px) 0 calc(env(safe-area-inset-left) + 12px)}
.p-bot{bottom:0;justify-content:center;gap:12px;padding:0 12px calc(env(safe-area-inset-bottom) + 16px)}
.pill,.pill-btn{background:rgba(28,28,30,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;border-radius:999px}
.pill-btn{width:48px;height:48px;display:grid;place-items:center}
.pill-btn:active,.speed button:active{background:rgba(70,70,75,.95)}
#remain{padding:0 14px;height:36px;display:flex;align-items:center;font-variant-numeric:tabular-nums;font-size:15px;font-weight:600}
#remain:empty{visibility:hidden}
.speed{display:flex;align-items:center;height:56px}
.speed button{width:56px;height:56px;border-radius:50%;font-size:28px;font-weight:400;line-height:1}
.speed span{min-width:64px;text-align:center;display:flex;flex-direction:column;line-height:1.1}
.speed b{font-size:20px;font-variant-numeric:tabular-nums}
.speed small{font-size:11px;color:#aaa}
.play-btn{width:68px;height:68px;border-radius:50%;background:var(--accent);color:#111;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.play-btn svg{width:30px;height:30px;fill:currentColor;stroke:none}
#prompter.playing .p-top{opacity:0;pointer-events:none}
#prompter.playing .p-top>*{pointer-events:none}
#prompter.playing .p-bot>*:not(.rec-btn){opacity:.35}
.grp{display:flex;gap:8px}
.pill-btn.on{background:var(--accent);color:#111}

/* Mode caméra */
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:none}
#cam.mirror{transform:scaleX(-1)}
#prompter.cam{--pbg:transparent;--pfg:#fff;--cue:#ffb020}
#prompter.cam #cam{display:block}
#prompter.cam #flip{bottom:auto;height:45%;overflow:hidden;background:rgba(0,0,0,.55)}
#prompter.cam #ptext{text-shadow:0 1px 3px rgba(0,0,0,.6)}
#prompter.cam .fade,#prompter.cam #restart{display:none}
/* Le flou d'arrière-plan recalculé sur une vidéo en direct fait saccader l'iPhone */
#prompter.cam .pill,#prompter.cam .pill-btn{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(28,28,30,.78)}
#prompter.cam .pill-btn.on{background:var(--accent)}
#rec-time{display:flex;align-items:center;gap:10px}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;width:0;background:#34c759;transition:width .08s linear}
#mic-select{width:100%;height:44px;border:0;border-radius:11px;background:var(--panel2);color:var(--text);
  font:inherit;font-size:16px;padding:0 12px;-webkit-appearance:none;appearance:none}
.hint-l{display:block;color:var(--muted);font-size:12px;margin-top:6px}
.dialog{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:24px}
.dialog-box{background:var(--panel);color:var(--text);border-radius:18px;padding:22px 18px 16px;width:100%;max-width:340px}
.dialog-box p{margin:0 0 18px;font-size:16px;line-height:1.45;white-space:pre-line}
.dialog-btns{display:flex;gap:10px}
.dialog-btns button{flex:1;height:48px;border-radius:12px;background:var(--panel2);font-weight:600}
#dialog-ok{background:var(--accent);color:#111}
#dialog-ok.danger{background:var(--danger);color:#fff}
.rec-btn{width:68px;height:68px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center;background:rgba(0,0,0,.25)}
.rec-btn span{width:50px;height:50px;border-radius:50%;background:#ff3b30;transition:.2s}
.rec-btn.on span{width:26px;height:26px;border-radius:6px}
#rec-time{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 100px);left:50%;transform:translateX(-50%);z-index:8;pointer-events:none;
  background:#ff3b30;color:#fff;font-weight:700;padding:6px 14px;border-radius:999px;font-variant-numeric:tabular-nums}
.result{position:fixed;inset:0;z-index:20;background:var(--bg);color:var(--text);display:flex;flex-direction:column;gap:12px;
  padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px)}
.result-head{display:flex;align-items:center;justify-content:space-between}
.result-head b{font-size:19px}
.result video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000;border-radius:14px}
.result-actions{display:flex;align-items:center;gap:12px}
.result-actions .primary{flex:1;justify-content:center}
.result-actions .link.danger{margin:0;padding:0 8px}
.hint{margin:0;color:var(--muted);font-size:13px;text-align:center}

#count{position:absolute;inset:0;display:grid;place-items:center;font-size:38vmin;font-weight:800;color:var(--accent);
  background:rgba(0,0,0,.35);pointer-events:none;z-index:6;font-variant-numeric:tabular-nums}
#toast{position:fixed;z-index:30!important;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translate(-50%,-8px);opacity:0;transition:.2s;
  background:rgba(28,28,30,.92);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;pointer-events:none;z-index:7}
#toast.show{opacity:1;transform:translate(-50%,0)}

.sheet{position:absolute;left:0;right:0;bottom:0;max-height:55%;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:10;
  background:var(--panel);color:var(--text);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.5);
  padding:6px calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 20px) calc(env(safe-area-inset-left) + 20px);
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
@media (min-width:700px){
  .sheet{left:auto;top:12px;bottom:12px;right:12px;width:380px;max-height:none;border-radius:22px;
    padding:6px 20px 20px;transform:translateX(110%)}
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-6px;background:var(--panel);padding:12px 0;z-index:1}
.sheet-head b{font-size:19px}
.link{color:var(--accent);font-weight:700;font-size:17px;padding:8px 4px}
.link.danger{color:var(--danger);font-weight:600;font-size:15px;display:block;margin:18px auto 0}
.field{display:block;padding:10px 0;border-bottom:1px solid var(--line)}
.field>span{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px}
.field output{color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:32px;margin:0;accent-color:var(--accent)}
.seg{display:flex;background:var(--panel2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:8px;font-size:15px;color:var(--muted)}
.seg button.on{background:#45454b;color:#fff;font-weight:600}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.toggle small{display:block;color:var(--muted);font-size:13px}
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:31px;background:#3a3a3e;position:relative;transition:.2s;flex:none;margin:0;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:.2s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(20px)}
</style>
</head>
<body>

<section id="library" class="view active">
  <header class="bar"><h1>Prompteur</h1></header>
  <div id="install" class="install" hidden>
    <span id="install-txt"></span>
    <button id="install-go" class="go" hidden>Installer</button>
    <button id="install-x" class="x" aria-label="Fermer">×</button>
  </div>
  <div class="scroll">
    <ul id="list"></ul>
    <p id="empty" class="empty" hidden>Aucun script pour l’instant.<br>Touchez « Nouveau script » pour commencer.</p>
  </div>
  <button id="new" class="fab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nouveau script</button>
</section>

<section id="editor" class="view">
  <header class="bar">
    <button class="icon-btn" data-back aria-label="Retour"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span class="bar-title">Script</span>
    <button id="del" class="icon-btn danger" aria-label="Supprimer"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </header>
  <textarea id="text" spellcheck="true" placeholder="Collez ou tapez votre texte ici…&#10;&#10;Astuce : [les indications entre crochets] s’affichent en couleur et ne comptent pas dans le temps de lecture."></textarea>
  <footer class="editor-foot">
    <span id="stats"></span>
    <button id="launch" class="primary"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Lancer</button>
  </footer>
</section>

<section id="prompter" class="view t-dark">
  <video id="cam" playsinline muted autoplay></video>
  <div id="stage">
    <div id="flip">
      <div id="guide"></div>
      <div id="ptext"></div>
      <div class="fade fade-top"></div>
      <div class="fade fade-bot"></div>
    </div>
  </div>
  <div id="progress"></div>

  <header class="ctl p-top">
    <button class="pill-btn" data-back aria-label="Retour"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span id="remain" class="pill"></span>
    <div class="grp">
      <button id="cam-flip" class="pill-btn" aria-label="Changer de caméra" hidden><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3M4 13a8 8 0 0 0 14.9 3"/><path d="M4 4v4h4M20 20v-4h-4"/></svg></button>
      <button id="cam-btn" class="pill-btn" aria-label="Mode caméra"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg></button>
      <button id="settings" class="pill-btn" aria-label="Réglages"><svg viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></button>
    </div>
  </header>
  <div id="rec-time" hidden><span id="rec-clock"></span></div>

  <footer class="ctl p-bot">
    <button id="restart" class="pill-btn" aria-label="Revenir au début"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
    <div class="speed pill">
      <button id="slower" aria-label="Plus lent">−</button>
      <span><b id="speed">140</b><small>mots/min</small></span>
      <button id="faster" aria-label="Plus rapide">+</button>
    </div>
    <button id="play" class="play-btn" aria-label="Lecture / pause"></button>
    <button id="rec" class="rec-btn" aria-label="Enregistrer" hidden><span></span></button>
  </footer>


  <div id="count" hidden></div>

  <div id="sheet" class="sheet">
    <div class="sheet-head"><b>Réglages</b><button id="sheet-close" class="link">OK</button></div>
    <label class="field"><span>Vitesse <output data-o="wpm"></output></span><input type="range" data-k="wpm" min="40" max="300" step="5"></label>
    <label class="field"><span>Taille du texte <output data-o="size"></output></span><input type="range" data-k="size" min="20" max="120" step="2"></label>
    <label class="field"><span>Marges latérales <output data-o="margin"></output></span><input type="range" data-k="margin" min="0" max="25" step="1"></label>
    <label class="field"><span>Interligne <output data-o="lh"></output></span><input type="range" data-k="lh" min="1" max="2" step="0.05"></label>
    <label class="field"><span>Ligne de lecture <output data-o="guide"></output></span><input type="range" data-k="guide" min="10" max="70" step="1"></label>
    <div class="field"><span>Thème</span>
      <div class="seg" data-k="theme"><button data-v="dark">Noir</button><button data-v="light">Blanc</button><button data-v="yellow">Jaune</button></div>
    </div>
    <div class="field"><span>Alignement</span>
      <div class="seg" data-k="align"><button data-v="left">Gauche</button><button data-v="center">Centré</button></div>
    </div>
    <div class="field"><span>Qualité vidéo (mode caméra)</span>
      <div class="seg" data-k="q"><button data-v="720">720p · plus fluide</button><button data-v="1080">1080p</button></div>
    </div>
    <label class="field"><span>Micro</span>
      <select id="mic-select"><option value="">Automatique (micro branché en priorité)</option></select>
      <small id="mic-used" class="hint-l"></small>
    </label>
    <label class="field"><span>Niveau du micro</span>
      <div class="meter"><i></i></div><small class="hint-l">En mode caméra, parlez normalement : la barre doit être verte. Si elle reste orange, rapprochez le micro.</small>
    </label>
    <label class="toggle"><span>Miroir horizontal<small>Pour un prompteur à vitre</small></span><input type="checkbox" class="switch" data-k="mirrorX"></label>
    <label class="toggle"><span>Miroir vertical</span><input type="checkbox" class="switch" data-k="mirrorY"></label>
    <label class="toggle"><span>Compte à rebours<small>3 secondes avant de démarrer</small></span><input type="checkbox" class="switch" data-k="countdown"></label>
    <button id="reset" class="link danger">Rétablir les réglages par défaut</button>
  </div>
</section>

<div id="result" class="result" hidden>
  <div class="result-head"><b>Vidéo enregistrée</b><button id="result-done" class="link">Terminé</button></div>
  <video id="result-video" controls playsinline preload="metadata"></video>
  <div class="result-actions">
    <button id="discard" class="link danger">Supprimer</button>
    <button id="save-video" class="primary">Enregistrer dans Photos</button>
  </div>
  <p class="hint">Dans le menu qui s’ouvre, choisissez «&nbsp;Enregistrer la vidéo&nbsp;».</p>
</div>

<div id="toast"></div>

<div id="dialog" class="dialog" hidden>
  <div class="dialog-box" role="alertdialog">
    <p id="dialog-msg"></p>
    <div class="dialog-btns"><button id="dialog-cancel">Annuler</button><button id="dialog-ok">OK</button></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
